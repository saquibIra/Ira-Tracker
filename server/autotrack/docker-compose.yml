# Runs the Autotrack service next to the solidtime stack (server/solidtime).
# Start solidtime first so its network exists, then: docker compose up -d --build
services:
  autotrack:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Reach solidtime over its internal Docker network.
      SOLIDTIME_URL: http://app:8000
      TIMEPILOT_DB_PATH: /data/autotrack.db
    ports:
      # Only this machine can reach it; put HTTPS (Caddy/Nginx) in front for real use.
      - "127.0.0.1:8010:8010"
    volumes:
      - timepilot-data:/data
    networks:
      - solidtime

volumes:
  timepilot-data:

networks:
  solidtime:
    name: solidtime_internal
    external: true
