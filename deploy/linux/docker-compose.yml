# Time Pilot production stack on any Linux server with Docker (see docs/DEPLOY_LINUX.md).
#
#   https://$DOMAIN/              web app (the solidtime fork in server/web) and its API
#   https://$DOMAIN/admin/        Super Admin panel
#   https://$DOMAIN/autotrack/    Autotrack service (AI auto-tracking; settings page at /autotrack/admin/)
#   https://$DOMAIN/download/     desktop app installers
#
# Secrets and settings live outside the code in $DATA_DIR (default /opt/timepilot-data),
# created by install.sh. Logs: `docker compose logs`, rotated (10 MB x 5 per container).

name: timepilot

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-web: &web
  # Built on the server from server/web (solidtime + Time Pilot changes).
  image: time-pilot/web:latest
  build: ../../server/web
  restart: always
  user: "1000:1000"
  env_file: ["${DATA_DIR:-/opt/timepilot-data}/laravel.env"]
  volumes:
    - solidtime-storage:/var/www/html/storage
  networks: [internal]
  depends_on: [database]
  logging: *logging

services:
  caddy:
    image: caddy:2
    restart: always
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: "${DOMAIN:?set DOMAIN}"
      ACME_EMAIL: "${ACME_EMAIL:?set ACME_EMAIL}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - "${DATA_DIR:-/opt/timepilot-data}/downloads:/srv/downloads:ro"
      - caddy-data:/data
      - caddy-config:/config
    networks: [internal]
    logging: *logging

  app:
    <<: *web
    environment:
      CONTAINER_MODE: http
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/health-check/up"]

  scheduler:
    <<: *web
    environment:
      CONTAINER_MODE: scheduler
    healthcheck:
      test: ["CMD", "healthcheck"]

  queue:
    <<: *web
    environment:
      CONTAINER_MODE: worker
      WORKER_COMMAND: "php /var/www/html/artisan queue:work"
    healthcheck:
      test: ["CMD", "healthcheck"]

  database:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: "${DB_DATABASE:-solidtime}"
      POSTGRES_USER: "${DB_USERNAME:-solidtime}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?set DB_PASSWORD}"
    volumes:
      - database-storage:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "${DB_DATABASE:-solidtime}", "-U", "${DB_USERNAME:-solidtime}"]
      retries: 3
      timeout: 5s
    logging: *logging

  gotenberg:
    image: gotenberg/gotenberg:8
    restart: always
    networks: [internal]
    logging: *logging

  autotrack:
    build: ../../server/autotrack
    image: time-pilot/autotrack:latest
    restart: always
    env_file: ["${DATA_DIR:-/opt/timepilot-data}/autotrack.env"]
    environment:
      # Same public URL the widgets use (HTTPS through Caddy).
      SOLIDTIME_URL: "https://${DOMAIN}"
      TIMEPILOT_DB_PATH: /data/autotrack.db
      TIMEPILOT_LOG_FORMAT: json
    volumes:
      - timepilot-data:/data
    networks: [internal]
    depends_on: [app]
    logging: *logging

networks:
  internal:

volumes:
  solidtime-storage:
  database-storage:
  timepilot-data:
  caddy-data:
  caddy-config:
