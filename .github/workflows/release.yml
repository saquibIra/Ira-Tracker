# Windows installer for employees. Run from GitHub → Actions → "Release (Windows)" →
# Run workflow (or push a tag v1.2.3). Set the repository variable TIMEPILOT_SERVER_URL
# (Settings → Secrets and variables → Actions → Variables) to the company server, e.g.
# https://time.example.com, so the installer is pre-configured.
name: Release (Windows)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: widget
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: widget/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: widget/src-tauri
      - run: npm ci
      - name: Build installer
        env:
          VITE_TIMEPILOT_SERVER_URL: ${{ vars.TIMEPILOT_SERVER_URL || 'https://tracker.aasnatech.com' }}
        run: npm run tauri build -- --bundles nsis
      - name: Name the installer
        shell: bash
        run: cp src-tauri/target/release/bundle/nsis/*-setup.exe TimePilot-windows.exe
      - uses: actions/upload-artifact@v4
        with:
          name: TimePilot-windows
          path: widget/TimePilot-windows.exe
          if-no-files-found: error
      - name: Attach to the GitHub release (tag builds)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: widget/TimePilot-windows.exe
