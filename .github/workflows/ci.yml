name: CI

on:
  push:
    branches: [main, staging, develop]
  pull_request:

jobs:
  widget:
    name: widget (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The requirements doc targets macOS and Windows.
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: widget
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: widget/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: widget/src-tauri
      - run: npm ci
      - name: UI typecheck and build
        run: npm run build
      - name: UI unit tests
        run: npm test
      - name: Rust format
        run: cargo fmt --check
        working-directory: widget/src-tauri
      - name: Rust lint
        run: cargo clippy --all-targets --locked -- -D warnings
        working-directory: widget/src-tauri
      - name: Rust unit tests
        run: cargo test --locked
        working-directory: widget/src-tauri

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm audit
        run: npm audit --audit-level=high
        working-directory: widget
      - name: cargo audit
        run: |
          cargo install cargo-audit --locked
          cargo audit
        working-directory: widget/src-tauri

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m py_compile server/seed/seed_demo.py

  autotrack:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/autotrack
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Tests
        run: uv run pytest -q
      - name: Dependency audit
        run: uv run pip-audit

  web:
    # The Time Pilot web app (solidtime fork): every patch must still match upstream, the
    # frontend must type-check and build, and the Time Pilot PHP must parse.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t time-pilot/web:ci server/web
      - name: PHP syntax
        run: |
          files=$(cd server/web/overlay && find . -name '*.php' | sed 's|^\./||')
          docker run --rm --entrypoint sh time-pilot/web:ci -c \
            "cd /var/www/html && for f in $(echo $files); do php -l \$f || exit 1; done"
